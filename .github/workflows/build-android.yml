name: Build SRB2KART Android

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        yes | sdkmanager --install "ndk;26.3.11579264" || true
        echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

    - name: Install CMake + Ninja
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Download game assets
      run: |
        mkdir -p assets/installer
        curl -L -o /tmp/assets.zip "https://github.com/STJr/Kart-Public/releases/download/v1.6/AssetsLinuxOnly.zip"
        unzip -o /tmp/assets.zip -d /tmp/assets
        cp /tmp/assets/srb2.srb /tmp/assets/gfx.kart /tmp/assets/textures.kart /tmp/assets/chars.kart /tmp/assets/maps.kart assets/installer/

    - name: Build SDL2 for Android
      run: |
        cd /tmp
        curl -L -o SDL2.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz"
        tar xzf SDL2.tar.gz
        for ABI in arm64-v8a armeabi-v7a; do
          mkdir -p /tmp/sdl2-build-$ABI
          cmake -B /tmp/sdl2-build-$ABI \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DCMAKE_C_FLAGS="-O2 -DNDEBUG" \
            -G Ninja \
            /tmp/SDL2-2.30.3
          cmake --build /tmp/sdl2-build-$ABI --parallel $(nproc)
          echo "=== SDL2 $ABI built ==="
          find /tmp/sdl2-build-$ABI -name "libSDL2*.so" -exec ls -la {} \;
        done

    - name: Build libpng for Android
      run: |
        for ABI in arm64-v8a armeabi-v7a; do
          mkdir -p /tmp/png-build-$ABI
          cmake -B /tmp/png-build-$ABI \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O2 -DNDEBUG" \
            -G Ninja \
            ${GITHUB_WORKSPACE}/libs/libpng-src
          cmake --build /tmp/png-build-$ABI --parallel $(nproc)
          echo "=== libpng $ABI built ==="
          find /tmp/png-build-$ABI -name "libpng*.a" -o -name "libpng*.so" | head -5
        done

    - name: Build SRB2KART native (arm64-v8a)
      run: |
        mkdir -p build-android-arm64
        PNG_A=$(find /tmp/png-build-arm64-v8a -name "libpng12*.a" | head -1)
        SDL_SO=$(find /tmp/sdl2-build-arm64-v8a -name "libSDL2*.so" | head -1)
        echo "PNG=$PNG_A SDL=$SDL_SO"
        cmake -B build-android-arm64 \
          -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-26 \
          -DANDROID_STL=c++_shared \
          -DCMAKE_BUILD_TYPE=Release \
          -DSRB2_CONFIG_USE_INTERNAL_LIBRARIES=OFF \
          -DSRB2_CONFIG_SDL2_USEMIXER=OFF \
          -DSRB2_CONFIG_HAVE_CURL=OFF \
          -DSRB2_CONFIG_DISCORD_RPC=OFF \
          -DSRB2_CONFIG_HWRENDER=OFF \
          -DCMAKE_C_FLAGS="-O2 -DNDEBUG -DSTDC_HEADERS -I${GITHUB_WORKSPACE}/libs/SDL2/include -I${GITHUB_WORKSPACE}/libs/libpng-src" \
          -DCMAKE_SHARED_LINKER_FLAGS="$SDL_SO -L$(dirname $PNG_A) -lpng12" \
          -G Ninja
        cmake --build build-android-arm64 --parallel $(nproc)
        echo "=== arm64 build output ==="
        find build-android-arm64 -name "*.so" -exec ls -la {} \;

    - name: Build SRB2KART native (armeabi-v7a)
      run: |
        mkdir -p build-android-armv7
        PNG_A=$(find /tmp/png-build-armeabi-v7a -name "libpng12*.a" | head -1)
        SDL_SO=$(find /tmp/sdl2-build-armeabi-v7a -name "libSDL2*.so" | head -1)
        cmake -B build-android-armv7 \
          -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=armeabi-v7a \
          -DANDROID_PLATFORM=android-26 \
          -DANDROID_STL=c++_shared \
          -DCMAKE_BUILD_TYPE=Release \
          -DSRB2_CONFIG_USE_INTERNAL_LIBRARIES=OFF \
          -DSRB2_CONFIG_SDL2_USEMIXER=OFF \
          -DSRB2_CONFIG_HAVE_CURL=OFF \
          -DSRB2_CONFIG_DISCORD_RPC=OFF \
          -DSRB2_CONFIG_HWRENDER=OFF \
          -DCMAKE_C_FLAGS="-O2 -DNDEBUG -DSTDC_HEADERS -I${GITHUB_WORKSPACE}/libs/SDL2/include -I${GITHUB_WORKSPACE}/libs/libpng-src" \
          -DCMAKE_SHARED_LINKER_FLAGS="$SDL_SO -L$(dirname $PNG_A) -lpng12" \
          -G Ninja
        cmake --build build-android-armv7 --parallel $(nproc)
        echo "=== armv7 build output ==="
        find build-android-armv7 -name "*.so" -exec ls -la {} \;

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      working-directory: android
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        mkdir -p app/src/main/jniLibs/armeabi-v7a
        cp ../build-android-arm64/bin/*.so app/src/main/jniLibs/arm64-v8a/ || true
        cp ../build-android-armv7/bin/*.so app/src/main/jniLibs/armeabi-v7a/ || true
        cp /tmp/sdl2-build-arm64-v8a/libSDL2.so app/src/main/jniLibs/arm64-v8a/ || true
        cp /tmp/sdl2-build-armeabi-v7a/libSDL2.so app/src/main/jniLibs/armeabi-v7a/ || true
        cp /tmp/png-build-arm64-v8a/libpng16.so app/src/main/jniLibs/arm64-v8a/ || true
        cp /tmp/png-build-armeabi-v7a/libpng16.so app/src/main/jniLibs/armeabi-v7a/ || true
        find app/src/main/jniLibs -name "*.so" -exec ls -la {} \;
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: srb2kart-android-debug
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 14
